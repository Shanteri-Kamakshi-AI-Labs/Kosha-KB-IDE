name: Build and Push Docker Image

on:
  push:
    branches:
      - "**"

env:
  REGISTRY: registry.skaill.app
  NEXUS_REPOSITORY: docker-hosted

jobs:
  build:
    name: Build reh-web (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64

    outputs:
      image_path: ${{ steps.metadata.outputs.image_path }}
      full_image: ${{ steps.metadata.outputs.full_image }}
      version: ${{ steps.metadata.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate image metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/kosha-ci-metadata.sh

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libkrb5-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if npm ci; then
              exit 0
            fi
            if [ "$i" -eq 5 ]; then
              echo "npm ci failed after 5 attempts" >&2
              exit 1
            fi
            echo "npm ci failed attempt ${i}, retrying..."
            sleep 5
          done

      - name: Compile core
        run: npm run gulp core-ci

      - name: Package reh-web server
        run: npm run gulp "vscode-reh-web-linux-${{ matrix.arch }}-min-ci"

      - name: Stage Docker context
        shell: bash
        run: |
          set -euo pipefail
          SRC="../vscode-reh-web-linux-${{ matrix.arch }}"
          if [ ! -d "${SRC}" ]; then
            echo "Missing packaged server at ${SRC}" >&2
            ls -la .. >&2 || true
            exit 1
          fi
          rm -rf .docker-context
          mkdir -p .docker-context/server
          cp -a "${SRC}/." .docker-context/server/
          cp Dockerfile .docker-context/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Nexus
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .docker-context
          file: .docker-context/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.metadata.outputs.image_path }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=kosha-kb-ide-reh-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=kosha-kb-ide-reh-${{ matrix.arch }}

      - name: Export digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Nexus
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Create multi-arch manifest
        shell: bash
        env:
          IMAGE_PATH: ${{ needs.build.outputs.image_path }}
          FULL_IMAGE: ${{ needs.build.outputs.full_image }}
        run: |
          set -euo pipefail
          if [ -z "${IMAGE_PATH}" ] || [ -z "${FULL_IMAGE}" ]; then
            echo "Missing image metadata from build job." >&2
            exit 1
          fi

          docker buildx imagetools create \
            --tag "${FULL_IMAGE}" \
            $(printf "${IMAGE_PATH}@sha256:%s " $(ls /tmp/digests))

          echo "Successfully pushed:"
          echo "${FULL_IMAGE}"
          docker buildx imagetools inspect "${FULL_IMAGE}"
